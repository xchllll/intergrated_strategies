<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便携式电子电路智能诊断系统</title>
    <script src="/static/plotly.min.js"></script>
    <style>
        :root {
            --ink: #183047;
            --muted: #65768a;
            --line: #dfe7ef;
            --panel: #ffffff;
            --blue: #1769e0;
            --orange: #d95c14;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: linear-gradient(145deg, #eef6ff 0%, #f6f8fb 52%, #fff6ee 100%);
        }
        .page {
            width: min(1480px, calc(100% - 32px));
            margin: 0 auto;
            padding: 26px 0 36px;
        }
        .header, .panel {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            box-shadow: 0 10px 32px rgba(33, 63, 94, 0.08);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 22px 26px;
        }
        h1 { margin: 0 0 6px; font-size: 25px; }
        .subtitle, .muted { margin: 0; color: var(--muted); font-size: 13px; }
        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 29px;
            padding: 4px 11px;
            border-radius: 999px;
            color: #425466;
            background: #edf2f7;
            font-size: 12px;
            font-weight: 650;
        }
        .badge-real { color: #116746; background: #dff7eb; }
        .badge-demo { color: #245b9b; background: #e2efff; }
        .badge-warning { color: #95580b; background: #fff0d6; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            padding: 17px 22px;
        }
        .switch-wrap { display: flex; align-items: center; gap: 11px; font-size: 14px; }
        .switch { position: relative; width: 48px; height: 26px; }
        .switch input { width: 0; height: 0; opacity: 0; }
        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            border-radius: 999px;
            background: #c5d0dc;
            transition: 0.2s;
        }
        .slider::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(20, 42, 65, 0.25);
            transition: 0.2s;
        }
        .switch input:checked + .slider { background: var(--blue); }
        .switch input:checked + .slider::before { transform: translateX(22px); }
        button {
            min-width: 175px;
            padding: 11px 22px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, #1769e0, #0e52b8);
            box-shadow: 0 8px 18px rgba(23, 105, 224, 0.24);
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
        }
        button:hover { filter: brightness(1.06); }
        button:disabled { cursor: wait; filter: grayscale(0.45); opacity: 0.65; }
        .notice {
            margin: 14px 0 0;
            padding: 11px 14px;
            border-radius: 10px;
            color: #33546e;
            background: #eaf4ff;
            font-size: 13px;
        }
        .notice-warning { color: #7f4a08; background: #fff1d9; }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 18px;
            margin-top: 18px;
        }
        .charts, .side { display: grid; gap: 18px; align-content: start; }
        .chart-panel, .side-panel, .info-panel { padding: 18px 20px; }
        h2 { margin: 0 0 12px; font-size: 16px; }
        .plot { width: 100%; min-height: 310px; }
        .info-panel p { margin: 7px 0; }
        .label { color: var(--muted); font-size: 12px; }
        .ai-name { margin: 10px 0 7px; color: var(--blue); font-size: 25px; font-weight: 750; }
        .ai-conf { margin: 0; color: #18865d; font-size: 21px; font-weight: 750; }
        .ai-note { min-height: 36px; }
        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .header { align-items: flex-start; flex-direction: column; }
            .status-row { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="header">
        <div>
            <h1>便携式电子电路智能诊断系统</h1>
            <p class="subtitle">DDS 扫频 / I-Q 相干解调 / Bode 曲线 / 电路拓扑识别</p>
        </div>
        <div class="status-row">
            <span id="source-badge" class="badge">读取数据源...</span>
            <span id="calibration-badge" class="badge">读取校准状态...</span>
        </div>
    </header>

    <section class="panel controls">
        <div class="switch-wrap">
            <span>校准路径：缓冲器</span>
            <label class="switch">
                <input id="buffer-toggle" type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
        <button id="start-btn" type="button" onclick="startSweep()">开始扫频测量</button>
    </section>

    <div id="notice" class="notice">页面已就绪。Windows 环境展示仓库内演示 CSV，PYNQ 环境读取硬件。</div>

    <section class="layout">
        <div class="charts">
            <article class="panel chart-panel">
                <h2>幅频特性</h2>
                <div id="magnitude-plot" class="plot"></div>
            </article>
            <article class="panel chart-panel" id="phase-container">
                <h2 id="phase-title">相频特性</h2>
                <div id="phase-plot" class="plot"></div>
            </article>
        </div>

        <aside class="side">
            <article class="panel side-panel">
                <h2>AI 识别结果</h2>
                <p class="label">电路拓扑</p>
                <p id="ai-topo" class="ai-name">等待测量</p>
                <p class="label">模型置信度</p>
                <p id="ai-conf" class="ai-conf">--%</p>
                <p id="ai-note" class="muted ai-note">尚未运行模型</p>
            </article>

            <article class="panel info-panel">
                <h2>本次数据状态</h2>
                <p class="label">采集来源</p>
                <p id="source-detail" class="muted">读取中...</p>
                <p class="label">校准状态</p>
                <p id="calibration-detail" class="muted">读取中...</p>
                <p class="muted">演示数据会明确标注；未完成四态校准时不宣称“已校准”。</p>
            </article>
        </aside>
    </section>
</main>
<script src="/static/dashboard.js"></script>
</body>
</html>
